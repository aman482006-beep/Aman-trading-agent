name: Portfolio Guardian tests

on:
  push:
    branches:
      - main
    paths:
      - "agent_lab/portfolio_guardian/**"
      - ".github/workflows/portfolio-guardian-tests.yml"
  pull_request:
    paths:
      - "agent_lab/portfolio_guardian/**"
      - ".github/workflows/portfolio-guardian-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run Portfolio Guardian tests
        working-directory: agent_lab/portfolio_guardian
        run: python -m pytest -q
