name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.11 · tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,demo]"

      - name: Check maintained code
        run: ruff check agent_lab app.py main.py scripts/check_preview.py

      - name: Compile maintained code
        run: python -m compileall -q agent_lab app.py main.py scripts/check_preview.py

      - name: Validate GitHub Pages preview JavaScript
        run: python scripts/check_preview.py

      - name: Run complete test suite
        run: python -m pytest -q --cov=agent_lab --cov-report=term-missing

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel
